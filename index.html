<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Cool Spine Roadmap</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      color: #1c2430;
      background: #f6f7f9;
      font: 13px/1.4 "Segoe UI", "Helvetica Neue", sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 24px;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #e3e8ee;
    }
    h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      color: #5c6b7a;
    }
    .filter-label { font-size: 12px; }
    .sep { width: 1px; height: 18px; background: #d5dbe3; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    button.pill {
      border: 0;
      border-radius: 999px;
      padding: 3px 8px;
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    button.pill[aria-pressed="false"] {
      background: transparent;
      color: #8b97a3;
      box-shadow: inset 0 0 0 1px #d5dbe3;
    }
    button.cmd {
      font: inherit;
      cursor: pointer;
      border: 1px solid #d5dbe3;
      background: #fff;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 650;
      color: #1c2430;
    }
    button.cmd:hover { border-color: #1a4478; color: #1a4478; }
    .pill.done { background: #e7f2ea; color: #1e5a38; }
    .pill.in_progress { background: #e6effa; color: #1a4478; }
    .pill.future { background: #eef0f3; color: #4b5563; }
    #error {
      margin: 0;
      padding: 8px 16px;
      background: #fdecec;
      color: #8a1f1f;
    }
    #error[hidden] { display: none; }
    #scroller { flex: 1; min-height: 0; overflow: auto; background: #fff; }
    table { width: max-content; border-collapse: separate; border-spacing: 0; }
    thead th {
      position: sticky;
      background: #fff;
      z-index: 4;
    }
    thead tr:first-child th.year { top: 0; height: 26px; }
    thead tr.quarters th {
      top: 26px;
      height: 22px;
      padding: 0;
      font-size: 11px;
      font-weight: 650;
      color: #3d4d5e;
      text-align: left;
      border-bottom: 1px solid #e3e8ee;
    }
    thead tr.quarters th.quarter { border-right: 1px solid #eef1f4; }
    thead tr.filters th {
      top: 48px;
      height: 28px;
      padding: 0 3px;
      vertical-align: middle;
      border-bottom: 1px solid #e3e8ee;
    }
    thead tr.filters th.name-col { padding-left: 12px; font-weight: 650; }
    thead tr.filters th.name-col.on { color: #1a4478; }
    thead tr:last-child th { top: 76px; height: 40px; }
    th.name-col { top: 0; }
    th.name-col, td.name-col {
      position: sticky;
      left: 0;
      width: 380px;
      min-width: 380px;
      max-width: 380px;
      z-index: 5;
      border-right: 1px solid #d5dbe3;
      box-shadow: 4px 0 8px rgba(20, 30, 40, 0.04);
    }
    th.name-col { z-index: 6; text-align: left; padding-left: 12px; font-size: 12px; color: #5c6b7a; }
    button.sprint-filter {
      display: block;
      width: 100%;
      height: 16px;
      padding: 0;
      border: 1px solid #d5dbe3;
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
    }
    button.sprint-filter:hover { border-color: #1a4478; }
    button.sprint-filter[aria-pressed="true"] {
      background: #1a4478;
      border-color: #1a4478;
    }
    th.sprint.picked { box-shadow: inset 0 -3px 0 #1a4478; }
    th.year {
      text-align: left;
      padding: 0;
      font-size: 12px;
      font-weight: 700;
      color: #1c2430;
      border-bottom: 1px solid #e3e8ee;
      z-index: 4;
    }
    .year-label, .quarter-label {
      position: sticky;
      left: 392px;
      display: inline-block;
      background: #fff;
    }
    .year-label { padding: 4px 12px 4px 8px; }
    .quarter-label { padding: 2px 10px 2px 8px; }
    th.sprint {
      width: 36px;
      min-width: 36px;
      padding: 4px 0 6px;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.15;
      color: #5c6b7a;
      vertical-align: bottom;
      border-bottom: 1px solid #e3e8ee;
      border-right: 1px solid #eef1f4;
    }
    th.sprint .day { display: block; color: #1c2430; font-size: 12px; font-variant-numeric: tabular-nums; }
    th.sprint.current { background: #e7f0fa; }
    th.sprint.current .day { color: #1a4478; }
    td.sprint, th.sprint { user-select: none; }
    td.sprint {
      height: 36px;
      padding: 0;
      text-align: center;
      vertical-align: middle;
      border-bottom: 1px solid #e6ebf0;
      border-right: 1px solid #eef1f4;
    }
    td.name-col { border-bottom: 1px solid #e6ebf0; background: #fff; }
    tr.epic td { background: #e8eef5; }
    tr.epic td.name-col { background: #e8eef5; }
    tr.task td.current { background: #f3f7fc; }
    tr.task:hover td.name-col { background: #f7f8fa; }
    tr.task td.sprint { cursor: pointer; }
    tr.task td.sprint:hover { background: #f4f6f8; }
    tr.milestone td.sprint { cursor: pointer; }
    tr.milestone td.current { background: #f3f7fc; }
    tr.milestone td.sprint:hover, tr.milestone td.preview { background: #fff4e8; }
    tr.task.status-done td.preview { background: #e7f2ea; }
    tr.task.status-in_progress td.preview { background: #e6effa; }
    tr.task.status-future td.preview { background: #eef0f3; }
    tr.task td.anchor { box-shadow: inset 0 0 0 2px #1a4478; }
    .mark { display: block; height: 10px; }
    tr.task.status-done td.in-bar .mark { background: #1e5a38; }
    tr.task.status-in_progress td.in-bar .mark { background: #1a4478; }
    tr.task.status-future td.in-bar .mark { background: #4b5563; }
    tr.task td.single .mark, tr.epic td.single .mark { margin: 0 4px; border-radius: 6px; }
    tr.task td.bar-start .mark, tr.epic td.bar-start .mark { margin-left: 4px; border-radius: 6px 0 0 6px; }
    tr.task td.bar-end .mark, tr.epic td.bar-end .mark { margin-right: 4px; border-radius: 0 6px 6px 0; }
    tr.epic td.sprint { position: relative; }
    tr.epic td.sprint .gem {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 1;
      margin: -4.5px 0 0 -4.5px;
    }
    .name-inner { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 8px 0 10px; }
    button.grip {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 22px;
      margin-left: -6px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #8b97a3;
      cursor: grab;
      touch-action: none;
    }
    button.grip:hover { background: #e6ebf0; color: #3d4d5e; }
    .grip-dots {
      width: 8px;
      height: 12px;
      background: radial-gradient(circle, currentColor 1.15px, transparent 1.25px) 0 0 / 4px 4px;
    }
    body.dragging { cursor: grabbing; user-select: none; }
    body.dragging button.grip { cursor: grabbing; }
    tr.dragging td { opacity: 0.45; }
    tr.drop-before td.name-col { box-shadow: inset 0 3px 0 #1a4478, 4px 0 8px rgba(20, 30, 40, 0.04); }
    tr.drop-after td.name-col { box-shadow: inset 0 -3px 0 #1a4478, 4px 0 8px rgba(20, 30, 40, 0.04); }
    .drag-ghost {
      position: fixed;
      z-index: 20;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 4px 8px;
      border-radius: 6px;
      background: #1a4478;
      color: #fff;
      font-size: 12px;
      font-weight: 650;
      pointer-events: none;
      box-shadow: 0 6px 16px rgba(20, 30, 40, 0.18);
    }
    .label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    tr.epic .label { font-weight: 700; cursor: pointer; }
    button.fold {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      margin-left: -4px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
    }
    button.fold:hover { background: #d5deea; }
    .chevron {
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid #3d4d5e;
    }
    tr.epic.folded .chevron {
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 5px solid #3d4d5e;
      border-right: 0;
    }
    .count {
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      color: #5c6b7a;
    }
    button.name, button.add, button.clear {
      font: inherit;
      cursor: pointer;
    }
    button.name {
      appearance: none;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
      border: 0;
      background: transparent;
      color: inherit;
      padding: 0;
    }
    button.name:hover { text-decoration: underline; text-underline-offset: 2px; }
    input.name {
      flex: 1;
      min-width: 0;
      font: inherit;
      border: 1px solid #1a4478;
      border-radius: 4px;
      padding: 3px 6px;
    }
    button.add, button.clear {
      flex: 0 0 auto;
      border: 1px solid #d5dbe3;
      background: #fff;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 650;
      color: #1c2430;
    }
    button.add:hover, button.clear:hover { border-color: #1a4478; color: #1a4478; }
    .tag {
      flex: 0 0 auto;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #9a3412;
      background: #fff4e8;
      border-radius: 999px;
      padding: 2px 6px;
    }
    .gem {
      display: inline-block;
      width: 9px;
      height: 9px;
      background: #c2410c;
      transform: rotate(45deg);
    }
    tr.flash td.name-col { background: #e7f6df; }
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid #1a4478;
      outline-offset: 1px;
    }
    select.status, span.status {
      flex: 0 0 auto;
      border: 0;
      border-radius: 999px;
      padding: 3px 6px;
      font: inherit;
      font-size: 11px;
      font-weight: 700;
    }
    select.status { cursor: pointer; }
    span.status { cursor: default; }
    select.status[data-status="done"], span.status[data-status="done"] { background: #e7f2ea; color: #1e5a38; }
    select.status[data-status="in_progress"], span.status[data-status="in_progress"] { background: #e6effa; color: #1a4478; }
    select.status[data-status="future"], span.status[data-status="future"] { background: #eef0f3; color: #4b5563; }
    .task-label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .as-of { margin: 2px 0 0; color: #5c6b7a; font-size: 12px; }
    body.viewer tr.task td.sprint,
    body.viewer tr.milestone td.sprint { cursor: default; }
    body.viewer tr.task td.sprint:hover { background: transparent; }
    body.viewer tr.task td.current:hover,
    body.viewer tr.milestone td.current:hover { background: #f3f7fc; }
    body.saving #scroller { pointer-events: none; }
    #app {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    #app[hidden] { display: none; }
    #gate {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #gate[hidden] { display: none; }
    #gate form {
      width: min(100%, 360px);
      background: #fff;
      border: 1px solid #e3e8ee;
      border-radius: 12px;
      padding: 24px;
    }
    #gate h2 { margin: 0 0 8px; font-size: 18px; font-weight: 650; }
    #gate p { margin: 0 0 16px; color: #5c6b7a; }
    #gate input {
      width: 100%;
      font: inherit;
      padding: 8px 10px;
      border: 1px solid #d5dbe3;
      border-radius: 8px;
      color: #1c2430;
    }
    #gate button { margin-top: 12px; }
    #gate-error { margin: 12px 0 0; color: #8a1f1f; }
  </style>
</head>
<body>
  <div id="gate" hidden>
    <form id="gate-form">
      <h2>Cool Spine Roadmap</h2>
      <p>Enter the password to view the schedule.</p>
      <input id="gate-password" type="password" name="password" autocomplete="current-password" required>
      <button type="submit" class="cmd">View roadmap</button>
      <p id="gate-error" hidden></p>
    </form>
  </div>
  <div id="app">
  <header>
    <div>
      <h1 id="title">Cool Spine Roadmap</h1>
      <p id="as-of" class="as-of" hidden></p>
    </div>
    <div class="toolbar">
      <button type="button" id="lock" class="cmd" hidden>Lock</button>
      <button type="button" id="fold-all" class="cmd">Fold all</button>
      <button type="button" id="unfold-all" class="cmd">Unfold all</button>
      <span class="sep" aria-hidden="true"></span>
      <span class="filter-label">Show</span>
      <button type="button" class="pill done" data-status="done" aria-pressed="true" title="Show only done tasks. Click another status to add it.">Done</button>
      <button type="button" class="pill in_progress" data-status="in_progress" aria-pressed="true" title="Show only in-progress tasks. Click another status to add it.">In progress</button>
      <button type="button" class="pill future" data-status="future" aria-pressed="true" title="Show only future tasks. Click another status to add it.">Future</button>
      <span class="sep" aria-hidden="true"></span>
      <span class="legend-item"><span class="gem"></span> Milestone</span>
    </div>
  </header>
  <p id="error" hidden></p>
  <div id="scroller">
    <table>
      <thead id="head"></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  </div>

      errorEl.textContent = "";
    }

    async function api(method, url, body) {
      const response = await fetch(url, {
        method,
        headers: body ? { "Content-Type": "application/json" } : undefined,
        body: body ? JSON.stringify(body) : undefined
      });
      const text = await response.text();
      let data = {};
      if (text) {
        try { data = JSON.parse(text); } catch { data = { error: text }; }
      }
      if (!response.ok) throw new Error(data.error || "Save failed");
      return data;
    }

    function findItem(id) {
      for (const epic of state.roadmap.epics) {
        for (const item of epic.items) {
          if (item.id === id) return item;
        }
      }
      return null;
    }

    function sprintLabel(iso) {
      const [, month, day] = iso.split("-");
      return MONTHS[Number(month) - 1] + " " + Number(day);
    }

    function quarterKey(iso) {
      const quarter = Math.floor((Number(iso.slice(5, 7)) - 1) / 3) + 1;
      return iso.slice(0, 4) + "-Q" + quarter;
    }

    function barEdges(start, end, sprintId) {
      if (!start || !end || sprintId < start || sprintId > end) return "";
      if (start === end) return "in-bar single";
      if (sprintId === start) return "in-bar bar-start";
      if (sprintId === end) return "in-bar bar-end";
      return "in-bar";
    }

    function sprintFlags(sprint, data) {
      return (sprint.id === data.today_sprint ? " current" : "") + (sprint.id === state.sprintId ? " picked" : "");
    }

    function coversSprint(item, sprintId) {
      return !!item.start && !!item.end && item.start <= sprintId && sprintId <= item.end;
    }

    function buildHead(data) {
      headEl.replaceChildren();
      const yearRow = document.createElement("tr");
      const corner = document.createElement("th");
      corner.className = "name-col";
      corner.textContent = "Task";
      yearRow.append(corner);
      let previousYear = "";
      for (const sprint of data.sprints) {
        const year = sprint.id.slice(0, 4);
        if (year !== previousYear) {
          const cell = document.createElement("th");
          cell.className = "year";
          cell.colSpan = data.sprints.filter((item) => item.id.slice(0, 4) === year).length;
          const label = document.createElement("span");
          label.className = "year-label";
          label.textContent = year;
          cell.append(label);
          yearRow.append(cell);
          previousYear = year;
        }
      }
      const quarterRow = document.createElement("tr");
      quarterRow.className = "quarters";
      const quarterCorner = document.createElement("th");
      quarterCorner.className = "name-col";
      quarterRow.append(quarterCorner);
      let previousQuarter = "";
      for (const sprint of data.sprints) {
        const key = quarterKey(sprint.id);
        if (key !== previousQuarter) {
          const cell = document.createElement("th");
          cell.className = "quarter";
          cell.colSpan = data.sprints.filter((item) => quarterKey(item.id) === key).length;
          cell.title = key.slice(5) + " " + key.slice(0, 4);
          const label = document.createElement("span");
          label.className = "quarter-label";
          label.textContent = key.slice(5);
          cell.append(label);
          quarterRow.append(cell);
          previousQuarter = key;
        }
      }
      const filterRow = document.createElement("tr");
      filterRow.className = "filters";
      const filterLabel = document.createElement("th");
      filterLabel.className = "name-col";
      filterLabel.id = "sprint-filter-label";
      filterLabel.textContent = "Current sprint";
      filterRow.append(filterLabel);
      for (const sprint of data.sprints) {
        const cell = document.createElement("th");
        const button = document.createElement("button");
        button.type = "button";
        button.className = "sprint-filter";
        button.dataset.sprint = sprint.id;
        const range = sprintLabel(sprint.id) + " – " + sprintLabel(sprint.last_day) + ", " + sprint.id.slice(0, 4);
        button.title = "Current sprint: show tasks with duration in " + range + ". Click again to show every task.";
        button.setAttribute("aria-label", "Current sprint, " + range);
        button.addEventListener("click", () => {
          state.sprintId = state.sprintId === sprint.id ? null : sprint.id;
          state.anchor = null;
          preserveRender();
        });
        cell.append(button);
        filterRow.append(cell);
      }
      const sprintRow = document.createElement("tr");
      const dateCorner = document.createElement("th");
      dateCorner.className = "name-col";
      sprintRow.append(dateCorner);
      for (const sprint of data.sprints) {
        const cell = document.createElement("th");
        cell.className = "sprint" + sprintFlags(sprint, data);
        cell.dataset.sprint = sprint.id;
        cell.title = sprintLabel(sprint.id) + " – " + sprintLabel(sprint.last_day) + ", " + sprint.id.slice(0, 4);
        const day = document.createElement("span");
        day.className = "day";
        day.textContent = String(Number(sprint.id.slice(8, 10)));
        const month = document.createElement("span");
        month.textContent = MONTHS[Number(sprint.id.slice(5, 7)) - 1];
        cell.append(day, month);
        sprintRow.append(cell);
      }
      headEl.append(yearRow, quarterRow, filterRow, sprintRow);
    }

    function statusVisible(status) {
      return state.statuses.size === 0 || state.statuses.has(status);
    }

    function taskShown(item) {
      if (item.kind !== "task" || !statusVisible(item.status)) return false;
      if (!state.sprintId) return true;
      return coversSprint(item, state.sprintId);
    }

    function milestoneShown(item, sprints) {
      if (!state.sprintId) return true;
      return sprintForDate(sprints, item.date) === state.sprintId;
    }

    function buildBody(data) {
      const fragment = document.createDocumentFragment();
      const milestones = [];
      for (const epic of data.epics) {
        for (const item of epic.items) {
          if (item.kind === "milestone") milestones.push(item);
        }
        if (epic.id === "milestones") continue;
        const shown = epic.items.some((item) => taskShown(item));
        if (state.sprintId && !shown) continue;
        const folded = state.folded.has(epic.id);
        fragment.append(epicRow(epic, data, folded));
        if (folded) continue;
        for (const item of epic.items) {
          if (item.kind !== "milestone" && taskShown(item)) fragment.append(taskRow(item, data, epic.id));
        }
      }
      const visibleMilestones = milestones.filter((item) => milestoneShown(item, data.sprints));
      if (visibleMilestones.length) fragment.append(milestoneSection(visibleMilestones, data));
      bodyEl.replaceChildren(fragment);
    }

    function coveredSpan(epic) {
      let start = null;
      let end = null;
      let count = 0;
      for (const item of epic.items) {
        if (!taskShown(item) || !item.start || !item.end) continue;
        count += 1;
        if (start === null || item.start < start) start = item.start;
        if (end === null || item.end > end) end = item.end;
      }
      if (!start) return null;
      return { start, end, label: count === 1 ? "1 task" : count + " tasks" };
    }

    function coveringStatuses(epic, sprintId) {
      const found = [];
      for (const item of epic.items) {
        if (!taskShown(item) || !coversSprint(item, sprintId) || found.includes(item.status)) continue;
        found.push(item.status);
      }
      return found;
    }

    function statusPaint(statuses) {
      const order = ["done", "in_progress", "future"].filter((status) => statuses.includes(status));
      if (order.length === 1) return STATUS_BAR[order[0]];
      return "linear-gradient(90deg, " + order.map((status, index) => {
        const start = (index / order.length) * 100;
        const end = ((index + 1) / order.length) * 100;
        return STATUS_BAR[status] + " " + start + "% " + end + "%";
      }).join(", ") + ")";
    }

    function epicRow(epic, data, folded) {
      const row = document.createElement("tr");
      row.className = "epic" + (folded ? " folded" : "");
      row.dataset.epic = epic.id;
      row.append(nameCell(epicName(epic, folded)));
      const span = folded ? coveredSpan(epic) : null;
      for (const sprint of data.sprints) {
        const statuses = folded ? coveringStatuses(epic, sprint.id) : [];
        const edges = statuses.length && span ? barEdges(span.start, span.end, sprint.id) : "";
        const cell = document.createElement("td");
        cell.className = "sprint" + (edges ? " " + edges : "") + sprintFlags(sprint, data);
        if (edges) {
          const mark = document.createElement("span");
          mark.className = "mark";
          mark.style.background = statusPaint(statuses);
          cell.title = span.label;
          cell.append(mark);
        }
        row.append(cell);
      }
      return row;
    }

    function epicName(epic, folded) {
      const wrap = document.createElement("div");
      wrap.className = "name-inner";
      const fold = document.createElement("button");
      fold.type = "button";
      fold.className = "fold";
      fold.setAttribute("aria-expanded", folded ? "false" : "true");
      fold.setAttribute("aria-label", (folded ? "Unfold " : "Fold ") + epic.name);
      const chevron = document.createElement("span");
      chevron.className = "chevron";
      chevron.setAttribute("aria-hidden", "true");
      fold.append(chevron);
      fold.addEventListener("click", () => toggleEpic(epic.id));
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = epic.name;
      label.title = epic.name;
      label.addEventListener("click", () => toggleEpic(epic.id));
      wrap.append(fold, label);
      const tasks = epic.items.filter((item) => item.kind === "task");
      const shown = tasks.filter((item) => taskShown(item)).length;
      if (tasks.length && (folded || shown !== tasks.length)) {
        const count = document.createElement("span");
        count.className = "count";
        count.textContent = shown === tasks.length ? String(tasks.length) : shown + "/" + tasks.length;
        count.title = shown + " of " + tasks.length + " tasks shown";
        wrap.append(count);
      }
      if (!VIEWER) {
        const add = document.createElement("button");
        add.type = "button";
        add.className = "add";
        add.textContent = "Add task";
        add.setAttribute("aria-label", "Add task to " + epic.name);
        add.addEventListener("click", () => addTask(epic.id));
        wrap.append(add);
      }
      return wrap;
    }

    function toggleEpic(id) {
      if (state.folded.has(id)) state.folded.delete(id);
      else state.folded.add(id);
      preserveRender();
    }

    function preserveRender() {
      if (!state.roadmap) return;
      const top = scrollerEl.scrollTop;
      const left = scrollerEl.scrollLeft;
      renderBody();
      scrollerEl.scrollTop = top;
      scrollerEl.scrollLeft = left;
    }

    function syncFilterButtons() {
      for (const [value] of STATUSES) {
        const button = document.querySelector('button.pill[data-status="' + value + '"]');
        if (button) button.setAttribute("aria-pressed", String(statusVisible(value)));
      }
    }

    function applyStatusFilter(status) {
      if (state.statuses.size === 0) state.statuses.add(status);
      else if (state.statuses.has(status)) state.statuses.delete(status);
      else {
        state.statuses.add(status);
        if (state.statuses.size === STATUSES.length) state.statuses.clear();
      }
      syncFilterButtons();
    }

    function ensureStatusShown(status) {
      if (statusVisible(status)) return;
      state.statuses.add(status);
      if (state.statuses.size === STATUSES.length) state.statuses.clear();
      syncFilterButtons();
    }

    function taskRow(task, data, epicId) {
      const row = document.createElement("tr");
      row.className = "task status-" + task.status;
      row.dataset.id = task.id;
      row.dataset.epic = epicId;
      row.append(nameCell(taskName(task)));
      for (const sprint of data.sprints) {
        const cell = document.createElement("td");
        cell.className = "sprint " + barEdges(task.start, task.end, sprint.id) + sprintFlags(sprint, data);
        if (state.anchor && state.anchor.itemId === task.id && state.anchor.sprintId === sprint.id) {
          cell.classList.add("anchor");
        }
        cell.dataset.item = task.id;
        cell.dataset.sprint = sprint.id;
        cell.title = sprintLabel(sprint.id) + " – " + sprintLabel(sprint.last_day);
        const mark = document.createElement("span");
        mark.className = "mark";
        cell.append(mark);
        row.append(cell);
      }
      return row;
    }

    function taskName(task) {
      const wrap = document.createElement("div");
      wrap.className = "name-inner";
      if (VIEWER) {
        const status = document.createElement("span");
        status.className = "status";
        status.dataset.status = task.status;
        status.textContent = STATUSES.find((item) => item[0] === task.status)[1];
        const name = document.createElement("span");
        name.className = "task-label";
        name.textContent = task.name;
        name.title = task.name;
        wrap.append(status, name);
        return wrap;
      }
      const grip = document.createElement("button");
      grip.type = "button";
      grip.className = "grip";
      grip.title = "Drag to reorder or move to another epic";
      grip.setAttribute("aria-label", "Drag " + task.name);
      const dots = document.createElement("span");
      dots.className = "grip-dots";
      dots.setAttribute("aria-hidden", "true");
      grip.append(dots);
      grip.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        event.preventDefault();
        onGripDown(event, task.id);
      });
      const select = document.createElement("select");
      select.className = "status";
      select.dataset.status = task.status;
      select.setAttribute("aria-label", "Status for " + task.name);
      for (const [value, label] of STATUSES) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = label;
        select.append(option);
      }
      select.value = task.status;
      select.addEventListener("change", () => {
        select.dataset.status = select.value;
        savePatch(task.id, { status: select.value });
      });
      const button = document.createElement("button");
      button.type = "button";
      button.className = "name";
      button.dataset.id = task.id;
      button.textContent = task.name;
      button.title = task.name;
      button.setAttribute("aria-label", "Rename " + task.name);
      button.addEventListener("click", () => beginEdit(button));
      wrap.append(grip, select, button);
      return wrap;
    }

    function beginEdit(button) {
      const id = button.dataset.id;
      const original = button.textContent;
      const input = document.createElement("input");
      input.className = "name";
      input.value = original;
      input.spellcheck = false;
      input.setAttribute("aria-label", "Task name");
      button.replaceWith(input);
      input.focus();
      input.select();
      let closed = false;
      function finish(save) {
        if (closed) return;
        closed = true;
        const next = input.value.trim();
        if (!save || next === original) {
          renderBody();
          return;
        }
        if (!next) {
          showError("A task name cannot be empty.");
          renderBody();
          return;
        }
        savePatch(id, { name: next });
      }
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          finish(true);
        } else if (event.key === "Escape") {
          event.preventDefault();
          finish(false);
        }
      });
      input.addEventListener("blur", () => finish(true));
    }

    function milestoneSection(items, data) {
      const folded = state.folded.has("milestones");
      const fragment = document.createDocumentFragment();
      const row = document.createElement("tr");
      row.className = "epic" + (folded ? " folded" : "");
      row.append(nameCell(milestoneHead(items, folded)));
      const gems = new Map();
      if (folded) {
        for (const item of items) {
          if (!item.date) continue;
          const sprintId = sprintForDate(data.sprints, item.date);
          if (!sprintId) continue;
          const names = gems.get(sprintId) || [];
          names.push(item.name);
          gems.set(sprintId, names);
        }
      }
      for (const sprint of data.sprints) {
        const cell = document.createElement("td");
        cell.className = "sprint" + sprintFlags(sprint, data);
        const names = gems.get(sprint.id);
        if (names) {
          const gem = document.createElement("span");
          gem.className = "gem";
          gem.title = names.join(", ");
          cell.append(gem);
        }
        row.append(cell);
      }
      fragment.append(row);
      if (!folded) {
        for (const item of items) fragment.append(milestoneRow(item, data));
      }
      return fragment;
    }

    function milestoneHead(items, folded) {
      const wrap = document.createElement("div");
      wrap.className = "name-inner";
      const fold = document.createElement("button");
      fold.type = "button";
      fold.className = "fold";
      fold.setAttribute("aria-expanded", folded ? "false" : "true");
      fold.setAttribute("aria-label", (folded ? "Unfold " : "Fold ") + "Milestones");
      const chevron = document.createElement("span");
      chevron.className = "chevron";
      chevron.setAttribute("aria-hidden", "true");
      fold.append(chevron);
      fold.addEventListener("click", () => toggleEpic("milestones"));
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = "Milestones";
      label.title = "Milestones";
      label.addEventListener("click", () => toggleEpic("milestones"));
      wrap.append(fold, label);
      if (folded) {
        const count = document.createElement("span");
        count.className = "count";
        count.textContent = String(items.length);
        count.title = items.length === 1 ? "1 milestone" : items.length + " milestones";
        wrap.append(count);
      }
      return wrap;
    }

    function milestoneRow(item, data) {
      const row = document.createElement("tr");
      row.className = "milestone";
      row.dataset.id = item.id;
      const wrap = document.createElement("div");
      wrap.className = "name-inner";
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = "Milestone";
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = item.name;
      label.title = !VIEWER && !item.date ? "Click a sprint to place " + item.name : item.name;
      wrap.append(tag, label);
      if (item.date && !VIEWER) {
        const clear = document.createElement("button");
        clear.type = "button";
        clear.className = "clear";
        clear.textContent = "Clear";
        clear.setAttribute("aria-label", "Clear date for " + item.name);
        clear.addEventListener("click", () => savePatch(item.id, { date: null }));
        wrap.append(clear);
      }
      row.append(nameCell(wrap));
      const placed = sprintForDate(data.sprints, item.date);
      for (const sprint of data.sprints) {
        const cell = plainCell(sprint, data);
        cell.dataset.item = item.id;
        cell.dataset.sprint = sprint.id;
        cell.title = sprintLabel(sprint.id) + " – " + sprintLabel(sprint.last_day);
        if (placed === sprint.id) {
          const gem = document.createElement("span");
          gem.className = "gem";
          gem.title = item.date;
          cell.append(gem);
        }
        row.append(cell);
      }
      return row;
    }

    function nameCell(child) {
      const cell = document.createElement("td");
      cell.className = "name-col";
      cell.append(child);
      return cell;
    }

    function plainCell(sprint, data) {
      const cell = document.createElement("td");
      cell.className = "sprint" + sprintFlags(sprint, data);
      return cell;
    }

    function sprintForDate(sprints, iso) {
      if (!iso) return null;
      for (const sprint of sprints) {
        if (sprint.id <= iso && iso <= sprint.last_day) return sprint.id;
      }
      return null;
    }

    function syncSprintButtons() {
      for (const button of headEl.querySelectorAll("button.sprint-filter")) {
        button.setAttribute("aria-pressed", String(button.dataset.sprint === state.sprintId));
      }
      for (const cell of headEl.querySelectorAll("th.sprint")) {
        cell.classList.toggle("picked", cell.dataset.sprint === state.sprintId);
      }
      const label = document.getElementById("sprint-filter-label");
      if (!label) return;
      label.textContent = state.sprintId ? "Current sprint: " + sprintLabel(state.sprintId) : "Current sprint";
      label.classList.toggle("on", !!state.sprintId);
    }

    function renderBody() {
      buildBody(state.roadmap);
      syncSprintButtons();
    }

    function longDate(iso) {
      const [year, month, day] = iso.split("-");
      return Number(day) + " " + MONTHS[Number(month) - 1] + " " + year;
    }

    function render() {
      const data = state.roadmap;
      document.title = data.title;
      titleEl.textContent = data.title;
      const asOf = document.getElementById("as-of");
      if (VIEWER && data.today) {
        asOf.hidden = false;
        asOf.textContent = "Schedule as of " + longDate(data.today);
      }
      buildHead(data);
      renderBody();
      if (!state.scrolled) {
        const current = headEl.querySelector("th.sprint.current");
        if (current) {
          const left = current.getBoundingClientRect().left - scrollerEl.getBoundingClientRect().left;
          scrollerEl.scrollLeft = scrollerEl.scrollLeft + left - 380 - 24;
        }
        const row = [...bodyEl.querySelectorAll("tr.task")].find((item) => item.querySelector("td.current.in-bar"));
        if (row) {
          const top = row.getBoundingClientRect().top - scrollerEl.getBoundingClientRect().top;
          scrollerEl.scrollTop += top - 48;
        }
        state.scrolled = true;
      }
    }

    async function savePatch(id, body) {
      const top = scrollerEl.scrollTop;
      const left = scrollerEl.scrollLeft;
      document.body.classList.add("saving");
      try {
        state.roadmap = await api("PATCH", "/api/items/" + encodeURIComponent(id), body);
        clearError();
      } catch (error) {
        showError(error.message);
        try { state.roadmap = await api("GET", "/api/roadmap"); } catch { /* keep the last good copy */ }
      } finally {
        document.body.classList.remove("saving");
        renderBody();
        scrollerEl.scrollTop = top;
        scrollerEl.scrollLeft = left;
      }
    }

    async function addTask(epicId) {
      const top = scrollerEl.scrollTop;
      const left = scrollerEl.scrollLeft;
      document.body.classList.add("saving");
      try {
        state.roadmap = await api("POST", "/api/epics/" + encodeURIComponent(epicId) + "/tasks");
        clearError();
      } catch (error) {
        showError(error.message);
        return;
      } finally {
        document.body.classList.remove("saving");
      }
      const epic = state.roadmap.epics.find((item) => item.id === epicId);
      const created = epic.items[epic.items.length - 1];
      state.folded.delete(epicId);
      ensureStatusShown(created.status);
      renderBody();
      scrollerEl.scrollTop = top;
      scrollerEl.scrollLeft = left;
      const row = bodyEl.querySelector('tr[data-id="' + CSS.escape(created.id) + '"]');
      if (!row) return;
      row.classList.add("flash");
      const bounds = row.getBoundingClientRect();
      const frame = scrollerEl.getBoundingClientRect();
      if (bounds.top < frame.top || bounds.bottom > frame.bottom) {
        scrollerEl.scrollTop += bounds.top - frame.top - 80;
      }
      const button = row.querySelector("button.name");
      if (button) beginEdit(button);
    }

    const drag = {
      pointer: null,
      id: null,
      handle: null,
      startX: 0,
      startY: 0,
      lastY: null,
      active: false,
      ghost: null,
      target: null,
      scrollTimer: null
    };

    function onGripDown(event, taskId) {
      if (document.body.classList.contains("saving") || drag.pointer !== null) return;
      drag.pointer = event.pointerId;
      drag.id = taskId;
      drag.handle = event.currentTarget;
      drag.startX = event.clientX;
      drag.startY = event.clientY;
      drag.active = false;
      try { event.currentTarget.setPointerCapture(event.pointerId); } catch { /* the pointer is already gone */ }
      document.addEventListener("pointermove", onGripMove);
      document.addEventListener("pointerup", onGripUp);
      document.addEventListener("pointercancel", onGripUp);
    }

    function onGripMove(event) {
      if (event.pointerId !== drag.pointer) return;
      const dx = event.clientX - drag.startX;
      const dy = event.clientY - drag.startY;
      if (!drag.active) {
        if (dx * dx + dy * dy < 25) return;
        beginDrag(event);
      }
      event.preventDefault();
      drag.lastY = event.clientY;
      placeGhost(event.clientX, event.clientY);
      autoScroll(event.clientY);
      showDrop(dropAt(event.clientY));
    }

    function beginDrag(event) {
      drag.active = true;
      state.anchor = null;
      document.body.classList.add("dragging");
      const row = taskRowEl(drag.id);
      if (row) row.classList.add("dragging");
      const ghost = document.createElement("div");
      ghost.className = "drag-ghost";
      const task = findItem(drag.id);
      ghost.textContent = task ? task.name : "Task";
      document.body.append(ghost);
      drag.ghost = ghost;
      placeGhost(event.clientX, event.clientY);
      drag.scrollTimer = setInterval(() => {
        if (drag.lastY == null) return;
        autoScroll(drag.lastY);
        showDrop(dropAt(drag.lastY));
      }, 32);
    }

    function placeGhost(x, y) {
      if (!drag.ghost) return;
      drag.ghost.style.left = (x + 14) + "px";
      drag.ghost.style.top = (y + 14) + "px";
    }

    function autoScroll(y) {
      const frame = scrollerEl.getBoundingClientRect();
      if (y < frame.top + 36) scrollerEl.scrollTop -= 14;
      else if (y > frame.bottom - 28) scrollerEl.scrollTop += 14;
    }

    function taskRowEl(id) {
      return bodyEl.querySelector('tr.task[data-id="' + CSS.escape(id) + '"]');
    }

    function clearDrop() {
      bodyEl.querySelectorAll("tr.drop-before, tr.drop-after").forEach((row) => {
        row.classList.remove("drop-before", "drop-after");
      });
    }

    function showDrop(target) {
      clearDrop();
      drag.target = target;
      if (!target) return;
      target.row.classList.add(target.place === "before" ? "drop-before" : "drop-after");
    }

    function dropRows() {
      return [...bodyEl.querySelectorAll("tr.epic[data-epic], tr.task[data-epic]")]
        .filter((row) => row.dataset.epic !== "milestones");
    }

    function startOfEpic(row) {
      const epic = state.roadmap.epics.find((item) => item.id === row.dataset.epic);
      const first = epic.items.find((item) => item.kind === "task" && item.id !== drag.id);
      return { row, place: "before", epic: epic.id, before: first ? first.id : null };
    }

    function endOfEpic(row) {
      return { row, place: "after", epic: row.dataset.epic, before: null };
    }

    function beforeTask(row) {
      return { row, place: "before", epic: row.dataset.epic, before: row.dataset.id };
    }

    function afterTask(row) {
      const epic = state.roadmap.epics.find((item) => item.id === row.dataset.epic);
      const tasks = epic.items.filter((item) => item.kind === "task");
      const index = tasks.findIndex((item) => item.id === row.dataset.id);
      let before = null;
      for (let cursor = index + 1; cursor < tasks.length; cursor += 1) {
        if (tasks[cursor].id !== drag.id) {
          before = tasks[cursor].id;
          break;
        }
      }
      return { row, place: "after", epic: epic.id, before };
    }

    function dropAt(y) {
      const rows = dropRows();
      if (!rows.length) return null;
      for (const row of rows) {
        const box = row.getBoundingClientRect();
        if (y >= box.bottom) continue;
        const mid = box.top + box.height / 2;
        if (row.classList.contains("epic")) {
          if (row.classList.contains("folded") && y >= mid) return endOfEpic(row);
          return startOfEpic(row);
        }
        return y < mid ? beforeTask(row) : afterTask(row);
      }
      const last = rows[rows.length - 1];
      return last.classList.contains("task") ? afterTask(last) : endOfEpic(last);
    }

    function samePlace(id, target) {
      if (!target || target.before === id) return true;
      const epic = state.roadmap.epics.find((item) => item.items.some((task) => task.id === id));
      if (!epic || epic.id !== target.epic) return false;
      const tasks = epic.items.filter((item) => item.kind === "task");
      const index = tasks.findIndex((item) => item.id === id);
      if (target.before == null) return index === tasks.length - 1;
      return tasks[index + 1] && tasks[index + 1].id === target.before;
    }

    function endDrag() {
      document.removeEventListener("pointermove", onGripMove);
      document.removeEventListener("pointerup", onGripUp);
      document.removeEventListener("pointercancel", onGripUp);
      if (drag.scrollTimer) clearInterval(drag.scrollTimer);
      if (drag.ghost) drag.ghost.remove();
      clearDrop();
      document.body.classList.remove("dragging");
      const row = drag.id ? taskRowEl(drag.id) : null;
      if (row) row.classList.remove("dragging");
      drag.pointer = null;
      drag.id = null;
      drag.handle = null;
      drag.active = false;
      drag.ghost = null;
      drag.target = null;
      drag.scrollTimer = null;
      drag.lastY = null;
    }

    function onGripUp(event) {
      if (event.pointerId !== drag.pointer) return;
      const active = drag.active;
      const id = drag.id;
      const target = drag.target;
      endDrag();
      if (!active || !id || !target || samePlace(id, target)) return;
      state.anchor = null;
      state.folded.delete(target.epic);
      saveMove(id, { epic: target.epic, before: target.before });
    }

    async function saveMove(id, body) {
      const top = scrollerEl.scrollTop;
      const left = scrollerEl.scrollLeft;
      document.body.classList.add("saving");
      try {
        state.roadmap = await api("POST", "/api/items/" + encodeURIComponent(id) + "/move", body);
        clearError();
      } catch (error) {
        showError(error.message);
        try { state.roadmap = await api("GET", "/api/roadmap"); } catch { /* keep the last good copy */ }
      } finally {
        document.body.classList.remove("saving");
        renderBody();
        scrollerEl.scrollTop = top;
        scrollerEl.scrollLeft = left;
      }
    }

    function onSprintClick(cell) {
      if (VIEWER) return;
      const itemId = cell.dataset.item;
      const sprintId = cell.dataset.sprint;
      if (!itemId || document.body.classList.contains("saving")) return;
      const item = findItem(itemId);
      if (item && item.kind === "milestone") {
        if (sprintForDate(state.roadmap.sprints, item.date) === sprintId) return;
        state.anchor = null;
        savePatch(itemId, { date: sprintId });
        return;
      }
      if (!state.anchor || state.anchor.itemId !== itemId) {
        state.anchor = { itemId, sprintId };
        renderBody();
        return;
      }
      const task = findItem(itemId);
      const start = state.anchor.sprintId < sprintId ? state.anchor.sprintId : sprintId;
      const end = state.anchor.sprintId < sprintId ? sprintId : state.anchor.sprintId;
      state.anchor = null;
      if (task && task.start === start && task.end === end) {
        renderBody();
        return;
      }
      savePatch(itemId, { start, end });
    }

    function preview(cell) {
      bodyEl.querySelectorAll("td.preview").forEach((item) => item.classList.remove("preview"));
      if (VIEWER || !cell || !cell.dataset.item) return;
      const item = findItem(cell.dataset.item);
      if (item && item.kind === "milestone") {
        cell.classList.add("preview");
        return;
      }
      if (!state.anchor || cell.dataset.item !== state.anchor.itemId) return;
      const sprintId = cell.dataset.sprint;
      const start = state.anchor.sprintId < sprintId ? state.anchor.sprintId : sprintId;
      const end = state.anchor.sprintId < sprintId ? sprintId : state.anchor.sprintId;
      bodyEl.querySelectorAll('td.sprint[data-item="' + CSS.escape(state.anchor.itemId) + '"]').forEach((item) => {
        if (item.dataset.sprint >= start && item.dataset.sprint <= end) item.classList.add("preview");
      });
    }

    bodyEl.addEventListener("click", (event) => {
      const cell = event.target.closest("td.sprint");
      if (cell && bodyEl.contains(cell)) onSprintClick(cell);
    });
    bodyEl.addEventListener("mouseover", (event) => {
      preview(event.target.closest("td.sprint"));
    });
    bodyEl.addEventListener("mouseleave", () => preview(null));
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && drag.active) {
        endDrag();
        return;
      }
      if (event.key === "Escape" && state.anchor && document.activeElement.tagName !== "INPUT") {
        state.anchor = null;
        renderBody();
      }
    });
    document.getElementById("fold-all").addEventListener("click", () => {
      if (!state.roadmap) return;
      for (const epic of state.roadmap.epics) state.folded.add(epic.id);
      preserveRender();
    });
    document.getElementById("unfold-all").addEventListener("click", () => {
      state.folded.clear();
      preserveRender();
    });
    document.querySelectorAll("button.pill").forEach((button) => {
      button.addEventListener("click", () => {
        applyStatusFilter(button.dataset.status);
        preserveRender();
      });
    });

    function sealKey() {
      return "roadmap-view:" + (SEALED && SEALED.data ? SEALED.data.slice(0, 24) : "");
    }

    function showGate() {
      document.getElementById("app").hidden = true;
      document.getElementById("gate").hidden = false;
      document.getElementById("gate-password").focus();
    }

    function openRoadmap() {
      document.getElementById("gate").hidden = true;
      document.getElementById("app").hidden = false;
      render();
    }

    function lockRoadmap() {
      sessionStorage.removeItem(sealKey());
      state.roadmap = null;
      state.anchor = null;
      state.scrolled = false;
      clearError();
      headEl.replaceChildren();
      bodyEl.replaceChildren();
      const input = document.getElementById("gate-password");
      input.value = "";
      document.getElementById("gate-error").hidden = true;
      showGate();
    }

    function bytesFromB64(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function unseal(password) {
      if (!window.crypto || !crypto.subtle) {
        throw new Error("Open this page on its web address. A file opened from the disk cannot unlock it.");
      }
      const material = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: bytesFromB64(SEALED.salt), iterations: SEALED.iterations, hash: "SHA-256" },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: bytesFromB64(SEALED.iv) },
        key,
        bytesFromB64(SEALED.data)
      );
      return JSON.parse(new TextDecoder().decode(plain));
    }

    document.getElementById("gate-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.getElementById("gate-password");
      const message = document.getElementById("gate-error");
      message.hidden = true;
      try {
        state.roadmap = await unseal(input.value);
        sessionStorage.setItem(sealKey(), JSON.stringify(state.roadmap));
        input.value = "";
        openRoadmap();
      } catch (error) {
        message.hidden = false;
        message.textContent = error.message && error.message.indexOf("disk") !== -1
          ? error.message
          : "That password is not correct.";
        input.select();
      }
    });

    async function init() {
      if (VIEWER) {
        document.body.classList.add("viewer");
        const lock = document.getElementById("lock");
        lock.hidden = false;
        lock.addEventListener("click", lockRoadmap);
        if (!SEALED) {
          showError("This view has no schedule.");
          return;
        }
        const cached = sessionStorage.getItem(sealKey());
        if (cached) {
          try {
            state.roadmap = JSON.parse(cached);
            openRoadmap();
            return;
          } catch {
            sessionStorage.removeItem(sealKey());
          }
        }
        showGate();
        return;
      }
      try {
        state.roadmap = BOOT || await api("GET", "/api/roadmap");
        render();
      } catch (error) {
        showError(error.message);
      }
    }

    init();
  </script>
</body>
</html>
